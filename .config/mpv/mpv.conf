image-display-duration=3
gpu-api=vulkan

# Hardware video decode on the Qualcomm iris block (aa00000.video-codec).
# --hwdec cannot be used: this mpv build offers only vulkan/vaapi/vdpau/amf
# backends, and neither applies here (no Qualcomm VA-API driver exists, and
# turnip exposes no VK_KHR_video_decode extensions).  The iris decoder is a
# plain libavcodec decoder instead, so select it via vd=.  Entries that do not
# match the file's codec are skipped, and anything not listed (AV1, VP8, ...)
# falls back to software automatically.
vd=hevc_v4l2m2m,h264_v4l2m2m,vp9_v4l2m2m

[image]
profile-desc = "Image"
video-aspect-override = no
keep-open

# deal with gopro jpegs
[extension.JPG]
loop-file=12
profile=image

[extension.jpg]
profile=image

[extension.png]
profile=image

[extension.tiff]
profile=image

[extension.tif]
profile=image